# 祥能 HRMS —— Render Blueprint 部署配置
#
# 单 Web Service 部署：API 进程同时托管门户（portal）静态构建产物，
# 连 Render Postgres addon，release 阶段跑迁移并导入演示数据。
# 一个固定网址 https://xxx.onrender.com 即可访问全部功能。
#
# 三种云端大模型 provider 的 BASE_URL / MODEL 示例（在 Render 后台手动填写，标 sync:false 的变量）：
#   DeepSeek:   XIANGNENG_LLM_BASE_URL=https://api.deepseek.com/v1  XIANGNENG_LLM_MODEL=deepseek-chat  XIANGNENG_LLM_CHAT_MODEL=deepseek-chat
#   SiliconFlow: XIANGNENG_LLM_BASE_URL=https://api.siliconflow.cn/v1  XIANGNENG_LLM_MODEL=Qwen/Qwen3-4B  XIANGNENG_LLM_CHAT_MODEL=Qwen/Qwen2.5-1.5B-Instruct
#   OpenAI:     XIANGNENG_LLM_BASE_URL=https://api.openai.com/v1  XIANGNENG_LLM_MODEL=gpt-4o-mini  XIANGNENG_LLM_CHAT_MODEL=gpt-4o-mini

services:
  # ---- 主应用：单个 Web Service ----
  - type: web
    name: xiangneng-hrms
    runtime: node
    # 说明：free 计划会在 15 分钟无流量后休眠（下次访问需冷启动十几秒），比赛/演示请务必用 starter。
    plan: starter
    region: oregon        # 可选：singapore / oregon / frankfurt 等
    branch: main
    # Render 注入 PORT 环境变量，应用已适配（process.env.PORT ?? API_PORT ?? 3310）。
    healthCheckPath: /api/ai/health
    # 构建：安装依赖 -> 生成 Prisma client -> 构建 api + portal（pnpm build 会递归构建所有包）。
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    # 启动：直接运行编译后的单服务（API 同时 serve 门户静态包）。
    startCommand: node apps/api/dist/server.js
    # release：数据库迁移 + 导入演示数据（依赖仓库内的 data/derived/demo-data.full.json）。
    releaseCommand: pnpm prisma migrate deploy && pnpm db:import-demo
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xiangneng-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false          # 在 Render 后台填写，需 ≥32 字符的随机串
      - key: AI_DEMO_MODE
        value: "true"
      - key: ADMIN_ORIGIN
        value: "*"           # 单服务同源部署，门户与 API 同域；留 "*" 即可
      - key: XIANGNENG_LLM_PROVIDER
        value: "openai"      # ollama | openai；云端部署用 openai
      - key: XIANGNENG_LLM_BASE_URL
        sync: false          # 见上方三种 provider 示例
      - key: XIANGNENG_LLM_MODEL
        sync: false          # 见上方三种 provider 示例
      - key: XIANGNENG_LLM_CHAT_MODEL
        sync: false          # 见上方三种 provider 示例
      - key: XIANGNENG_LLM_API_KEY
        sync: false          # 云端 LLM 的 API Key（如 DeepSeek / SiliconFlow / OpenAI）

  # ---- 数据库：Render Postgres ----
  - type: postgres
    name: xiangneng-db
    plan: starter          # free 仅 256MB，1.7 万人员演示数据偏紧，建议 starter
    databaseName: xiangneng_hrms_demo
    user: xiangneng
    postgresMajorVersion: "16"
