name: Restore corrected miniapp reimbursement detail

on:
  push:
    branches:
      - feat/data-migration-workflow-access-accounts
    paths:
      - .github/workflows/restore-miniapp-reimbursement-detail.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-migration-workflow-access-accounts
          fetch-depth: 0
      - name: Restore corrected source file
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/1o6cPmiV3Rh6WIvc' -o /tmp/detail-fix.zip
          unzip -t /tmp/detail-fix.zip
          unzip -qo /tmp/detail-fix.zip -d .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/miniapp/src/pages/reimbursements/detail/index.tsx
          git commit -m 'fix: align reimbursement detail with miniapp contracts'
          git push origin HEAD:feat/data-migration-workflow-access-accounts
