name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/data-migration-workflow-access-accounts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and validate Prisma client
        run: |
          pnpm db:generate
          pnpm db:validate
      - name: Verify static domain contracts
        run: node --experimental-strip-types --test apps/api/test/*node.test.ts scripts/project-tools/*.test.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
