name: Publish complete HRMS source from chunks

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/source-chunks-ready.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Reconstruct and verify complete source archive
        shell: bash
        run: |
          set -euo pipefail
          count="$(find source-archive -maxdepth 1 -name 'part-*.b64' -type f | wc -l)"
          test "$count" = '31'
          cat source-archive/part-*.b64 | base64 --decode > /tmp/xiangneng-hrms.tar.gz
          echo '0c375e52d853fbdaf489c1837e650a2ac4d16896b40283bd9fb910e73c512405  /tmp/xiangneng-hrms.tar.gz' | sha256sum -c -
      - name: Replace transport files with complete source tree
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          tar -xzf /tmp/xiangneng-hrms.tar.gz -C "$TMP_DIR"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$TMP_DIR"/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish complete HRMS source with internal HR and reimbursement'
          git push origin "HEAD:${GITHUB_HEAD_REF:-agent/internal-hr-reimbursement-foundation}"
